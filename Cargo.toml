[package]
name = "ccrop"
version = "0.3.0"
edition = "2021"
authors = ["Rhyd Lewis <rhyd.lewis@icloud.com>"]
description = "A CLI tool that applies a circular crop with transparent background to images from URLs or local files"
repository = "https://github.com/rhydlewis/profile-crop"
license = "MIT"
keywords = ["image", "crop", "cli", "circular", "avatar"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "ccrop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
image = "0.24"
thiserror = "1.0"
arboard = "3.4"
